<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <link rel="icon" href="/assets/icons/128.png">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="theme-color" content="#000000">
        <meta name="description" content="Audio Equalizer Pro - Odtwarzacz muzyczny z korektorem graficznym">
        <title>Audio Equalizer - EQ Pro</title>
        <style>
            * { box-sizing: border-box; }
            body#eq {
                margin: 0;
                padding: 0;
                width: 700px;
                height: 420px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #121212;
                color: #e0e0e0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .header {
                height: 45px;
                background-color: #1f1f1f;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 15px;
                border-bottom: 1px solid #333;
                flex-shrink: 0;
            }
            .header-title { font-weight: 600; font-size: 0.95rem; color: #f0743a; }
            .main-content { display: flex; flex-grow: 1; height: calc(420px - 45px - 60px); overflow: hidden; }
            .eq-panel {
                width: 380px; padding: 15px; background-color: #181818;
                border-right: 1px solid #333; display: flex; flex-direction: column; gap: 10px;
            }
            .eq-sliders { display: flex; justify-content: space-between; flex-grow: 1; align-items: center; }
            .eq-slider-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
            .eq-db { font-size: 0.65rem; color: #888; }
            .eq-slider-container { width: 25px; height: 120px; position: relative; display: flex; align-items: center; justify-content: center; }
            input[type="range"].eq-slider {
                appearance: none; width: 120px; height: 5px; border-radius: 3px; background: #333;
                position: absolute; transform: rotate(-90deg); cursor: pointer;
            }
            input[type="range"].eq-slider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background-color: #f0743a; }
            .eq-freq-label { font-size: 0.65rem; color: #aaa; }
            .playlist-panel { flex-grow: 1; background-color: #121212; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
            .song-list { flex-grow: 1; overflow-y: auto; background: #181818; border: 1px solid #333; border-radius: 6px; padding: 8px; }
            .song-item { padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .song-item:hover { background-color: #252525; }
            .song-item.active { background-color: #f0743a; color: #fff; font-weight: 600; }
            .player-footer { height: 60px; background-color: #1f1f1f; border-top: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; flex-shrink: 0; }
            .now-playing { font-size: 0.85rem; width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .controls { display: flex; gap: 10px; align-items: center; }
            .ctrl-btn { background: none; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; }
            .ctrl-btn.main { color: #f0743a; font-size: 1.4rem; }
            .vol-container { display: flex; align-items: center; gap: 8px; }
            input[type="range"].volume-slider { appearance: none; width: 80px; height: 5px; background: #333; border-radius: 3px; cursor: pointer; }
            input[type="range"].volume-slider::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; border-radius: 50%; background-color: #f0743a; }
        </style>
    </head>
    <body id="eq">
        <header class="header">
            <div class="header-title">🎛️ Audio Equalizer - Pro (±30dB)</div>
            <div id="statusText" style="font-size: 0.75rem; color: #888;">Ładowanie z folderu music/...</div>
        </header>

        <div class="main-content">
            <div class="eq-panel">
                <div style="font-size: 0.8rem; font-weight: 600; color: #ccc;">Korektor graficzny (Max ±30dB)</div>
                <div class="eq-sliders" id="eq-sliders-container"></div>
            </div>

            <div class="playlist-panel">
                <div style="font-size: 0.8rem; font-weight: 600; color: #ccc; margin-bottom: 5px;">Piosenki z folderu music/</div>
                <div class="song-list" id="song-list">Pobieranie listy...</div>
            </div>
        </div>

        <footer class="player-footer">
            <div class="now-playing" id="nowPlayingTitle">Wybierz utwór...</div>
            <div class="controls">
                <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
                <button class="ctrl-btn main" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
            </div>
            <div class="vol-container">
                <span style="font-size: 0.75rem; color: #888;">🔊</span>
                <input type="range" class="volume-slider" min="0" max="100" value="50" oninput="changeVolume(this.value)">
            </div>
        </footer>

        <audio id="audioPlayer" crossorigin="anonymous" playsinline webkit-playsinline preload="auto"></audio>

        <script>
            const GITHUB_USER = "lipiecgabriel4-wq";
            const GITHUB_REPO = "zay0ox";

            const eqFrequencies = [32, 64, 125, 250, 500, '1k', '2k', '4k', '8k', '16k'];
            let playlist = [];
            let currentIndex = 0;

            let audioCtx, sourceNode, gainNode, limiterNode, eqFilters = [];
            let isAudioInit = false;
            let userPaused = true; // true = użytkownik sam zatrzymał (lub jeszcze nic nie gra)
            const audioPlayer = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');

            // KLUCZOWA ZMIANA dla iOS: traktuj stronę jako odtwarzacz multimediów,
            // dzięki temu dźwięk (także z Web Audio) gra po zablokowaniu ekranu
            // i przy przełączeniu aplikacji. Wymaga iOS 16.4+.
            function setPlaybackAudioSession() {
                try {
                    if (navigator.audioSession) navigator.audioSession.type = 'playback';
                } catch (e) {}
            }
            setPlaybackAudioSession();

            function changeVolume(val) {
                if (gainNode && audioCtx) {
                    gainNode.gain.setValueAtTime((val / 100) * 0.3, audioCtx.currentTime);
                }
            }

            function generateEqSliders() {
                const container = document.getElementById('eq-sliders-container');
                container.innerHTML = '';
                eqFrequencies.forEach((freq, index) => {
                    const sliderGroup = document.createElement('div');
                    sliderGroup.className = 'eq-slider-group';
                    sliderGroup.innerHTML = `
                        <div class="eq-db" id="val-db-${index}">0dB</div>
                        <div class="eq-slider-container">
                            <input type="range" class="eq-slider" min="-30" max="30" value="0" step="0.5" oninput="changeEqFilter(${index}, this.value)">
                        </div>
                        <div class="eq-freq-label">${freq}</div>
                    `;
                    container.appendChild(sliderGroup);
                });
            }

            async function ensureCtxRunning() {
                if (!audioCtx) return;
                // na iOS stan może być też 'interrupted', nie tylko 'suspended'
                if (audioCtx.state !== 'running') {
                    try { await audioCtx.resume(); } catch (e) {}
                }
            }

            function initAudioContext() {
                if (isAudioInit) return;
                setPlaybackAudioSession();

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                sourceNode = audioCtx.createMediaElementSource(audioPlayer);

                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

                limiterNode = audioCtx.createDynamicsCompressor();
                limiterNode.threshold.setValueAtTime(-3.0, audioCtx.currentTime);
                limiterNode.knee.setValueAtTime(0, audioCtx.currentTime);
                limiterNode.ratio.setValueAtTime(30, audioCtx.currentTime);
                limiterNode.attack.setValueAtTime(0.001, audioCtx.currentTime);
                limiterNode.release.setValueAtTime(0.05, audioCtx.currentTime);

                eqFilters = eqFrequencies.map((freq, index) => {
                    const filter = audioCtx.createBiquadFilter();
                    if (index === 0) {
                        filter.type = 'lowshelf';
                        filter.frequency.setValueAtTime(32, audioCtx.currentTime);
                    } else if (index === eqFrequencies.length - 1) {
                        filter.type = 'highshelf';
                        filter.frequency.setValueAtTime(16000, audioCtx.currentTime);
                    } else {
                        filter.type = 'peaking';
                        filter.frequency.setValueAtTime(typeof freq === 'string' ? parseInt(freq) * 1000 : freq, audioCtx.currentTime);
                        filter.Q.setValueAtTime(1.2, audioCtx.currentTime);
                    }
                    filter.gain.setValueAtTime(0, audioCtx.currentTime);
                    return filter;
                });

                let current = sourceNode;
                eqFilters.forEach(filter => {
                    current.connect(filter);
                    current = filter;
                });
                current.connect(gainNode);
                gainNode.connect(limiterNode);
                limiterNode.connect(audioCtx.destination);

                // Gdy iOS zawiesi kontekst (blokada ekranu, rozmowa), a muzyka ma grać – wznów
                audioCtx.onstatechange = () => {
                    if (audioCtx.state !== 'running' && !userPaused) {
                        ensureCtxRunning();
                    }
                };

                isAudioInit = true;
            }

            function changeEqFilter(index, value) {
                if (!isAudioInit) initAudioContext();
                document.getElementById(`val-db-${index}`).innerText = (value > 0 ? '+' : '') + parseFloat(value).toFixed(1) + 'dB';
                if (eqFilters[index]) {
                    eqFilters[index].gain.setTargetAtTime(parseFloat(value), audioCtx.currentTime, 0.02);
                }
            }

            async function loadMusicFromGitHub() {
                try {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/music`);
                    const data = await response.json();

                    playlist = data
                        .filter(file => file.name.endsWith('.mp3'))
                        .map(file => ({
                            name: file.name.replace(/\.[^/.]+$/, ""),
                            url: file.download_url
                        }));

                    document.getElementById('statusText').innerText = `${playlist.length} utworów gotowych`;
                    renderPlaylist();
                } catch (err) {
                    document.getElementById('song-list').innerHTML = '<div style="color: #ff6b6b; padding: 10px; font-size: 0.8rem;">Błąd wczytywania folderu music/</div>';
                    document.getElementById('statusText').innerText = "Błąd";
                }
            }

            function renderPlaylist() {
                const songListEl = document.getElementById('song-list');
                songListEl.innerHTML = '';
                if (playlist.length === 0) {
                    songListEl.innerHTML = '<div style="color: #888; padding: 10px; font-size: 0.8rem;">Brak plików MP3 w folderze</div>';
                    return;
                }
                playlist.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = `song-item ${index === currentIndex ? 'active' : ''}`;
                    item.innerHTML = `🎵 ${track.name}`;
                    item.onclick = () => playTrack(index);
                    songListEl.appendChild(item);
                });
            }

            async function playTrack(index) {
                if (playlist.length === 0) return;
                currentIndex = index;
                const track = playlist[currentIndex];

                document.getElementById('nowPlayingTitle').innerText = "Ładowanie...";

                if (!isAudioInit) initAudioContext();
                await ensureCtxRunning();

                userPaused = false;
                audioPlayer.src = track.url;
                audioPlayer.load();

                try {
                    await audioPlayer.play();
                } catch (err) {
                    console.log("Odtwarzanie zablokowane:", err);
                }

                document.getElementById('nowPlayingTitle').innerText = track.name;
                setupMediaSession(track.name);
                renderPlaylist();
            }

            function setupMediaSession(trackName) {
                if (!('mediaSession' in navigator)) return;

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: trackName,
                    artist: 'Audio Equalizer Pro',
                    album: 'Folder music/'
                });

                navigator.mediaSession.setActionHandler('play', async () => {
                    userPaused = false;
                    await ensureCtxRunning();
                    audioPlayer.play().catch(() => {});
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    userPaused = true;
                    audioPlayer.pause();
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => { prevTrack(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { nextTrack(); });
            }

            async function togglePlay() {
                if (audioPlayer.paused) {
                    if (!audioPlayer.src && playlist.length > 0) { playTrack(currentIndex); return; }
                    if (!isAudioInit) initAudioContext();
                    userPaused = false;
                    await ensureCtxRunning();
                    audioPlayer.play().catch(() => {});
                } else {
                    userPaused = true;
                    audioPlayer.pause();
                }
            }

            function nextTrack() {
                if (currentIndex + 1 < playlist.length) playTrack(currentIndex + 1);
                else playTrack(0);
            }

            function prevTrack() {
                if (currentIndex - 1 >= 0) playTrack(currentIndex - 1);
                else if (playlist.length > 0) playTrack(playlist.length - 1);
            }

            // Synchronizacja przycisku i ekranu blokady ze stanem odtwarzacza
            audioPlayer.addEventListener('play', () => {
                playBtn.textContent = '⏸';
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            });
            audioPlayer.addEventListener('pause', () => {
                playBtn.textContent = '▶';
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            });
            audioPlayer.addEventListener('ended', nextTrack);

            // Powrót do strony: wznów kontekst i muzykę, jeśli użytkownik jej nie zatrzymał
            async function resumeIfNeeded() {
                if (document.hidden) return;
                await ensureCtxRunning();
                if (!userPaused && audioPlayer.paused && audioPlayer.src && !audioPlayer.ended) {
                    audioPlayer.play().catch(() => {});
                }
            }
            document.addEventListener('visibilitychange', resumeIfNeeded);
            window.addEventListener('pageshow', resumeIfNeeded);
            window.addEventListener('focus', resumeIfNeeded);

            generateEqSliders();
            loadMusicFromGitHub();
        </script>
    </body>
</html>
