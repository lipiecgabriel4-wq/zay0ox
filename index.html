<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>One Take | Player & EQ Pro (Fixed)</title>
  <style>
    :root {
      --bg-color: #f7f9fc;
      --panel-bg: #ffffff;
      --accent-orange: #f0743a;
      --text-main: #333333;
      --text-muted: #888888;
      --shadow-soft: 0 4px 12px rgba(0,0,0,0.05);
      --font-family: 'Open Sans', 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header-panel {
      height: 60px;
      padding: 0 20px;
      border-bottom: 1px solid #e1e8ed;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      flex-shrink: 0;
    }
    .header-logo { font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: 10px; color: #df2c2c; }
    .main-container { display: flex; flex-grow: 1; height: calc(100vh - 60px); }
    .sidebar-left { width: 250px; background: var(--panel-bg); border-right: 1px solid #e1e8ed; display: flex; flex-direction: column; padding: 30px; align-items: center; gap: 10px; }
    .volume-slider-container { width: 40px; height: 200px; position: relative; }
    input[type="range"].volume-slider {
      appearance: none; width: 200px; height: 10px; border-radius: 5px; background: #e0e6ed;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); cursor: pointer;
    }
    input[type="range"].volume-slider::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; border-radius: 50%; background-color: var(--accent-orange); }
    .sidebar-right { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
    .eq-effects-panel { background: var(--panel-bg); border: 1px solid #e1e8ed; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: var(--shadow-soft); }
    .eq-sliders { display: flex; gap: 5px; padding: 10px 0; }
    .eq-slider-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .eq-slider-container { width: 100%; height: 100px; position: relative; }
    input[type="range"].eq-slider {
      appearance: none; width: 100px; height: 6px; border-radius: 3px; background: #e0e6ed;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-90deg); cursor: pointer;
    }
    input[type="range"].eq-slider::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background-color: var(--accent-orange); }
    .songs-panel { flex-grow: 1; background: var(--panel-bg); border: 1px solid #e1e8ed; border-radius: 12px; padding: 10px; overflow-y: auto; box-shadow: var(--shadow-soft); }
    .song-item { padding: 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .song-item:hover { background-color: #f1f4f8; }
    .song-item.active { background-color: var(--accent-orange); color: white; }
    .player-controls { height: 80px; padding: 0 20px; border-top: 1px solid #e1e8ed; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); }
    .control-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--text-main); }
    .control-btn.main { color: var(--accent-orange); font-size: 1.8rem; }
  </style>
</head>
<body>

  <header class="header-panel">
    <div class="header-logo"><span>▶</span><span>One Take | Player z EQ</span></div>
  </header>

  <div class="main-container">
    <aside class="sidebar-left">
      <span id="volume-val" style="font-weight:700; font-size:1.2rem;">80%</span>
      <div class="volume-slider-container">
        <!-- Ustawiłem domyślnie 80%, żeby zapobiec przesterom -->
        <input type="range" class="volume-slider" min="0" max="100" value="80" oninput="changeVolume(this.value)">
      </div>
      <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">GŁOŚNOŚĆ</span>
    </aside>

    <main class="sidebar-right">
      <div class="eq-effects-panel">
        <h4 style="margin:0;">Equalizer (Zabezpieczony przed charczeniem)</h4>
        <div class="eq-sliders" id="eq-sliders-container"></div>
      </div>
      <div class="songs-panel">
        <div class="song-list" id="song-list">Ładowanie utworów...</div>
      </div>
    </main>
  </div>

  <footer class="player-controls">
    <div id="nowPlayingTitle" style="font-weight: 600;">Wybierz utwór...</div>
    <div style="display:flex; gap:15px; align-items:center;">
      <button class="control-btn" onclick="prevTrack()">⏮</button>
      <button class="control-btn main" onclick="togglePlay()">▶</button>
      <button class="control-btn" onclick="nextTrack()">⏭</button>
    </div>
    <div style="width: 150px;"></div>
  </footer>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const GITHUB_USER = "lipiecgabriel4-wq";
    const GITHUB_REPO = "zay0ox";

    const eqFrequencies = [32, 64, 125, 250, 500, '1k', '2k', '4k', '8k', '16k'];
    let playlist = [];
    let currentIndex = 0;
    
    let audioCtx, sourceNode, gainNode, eqFilters = [];
    let isAudioInit = false;
    const audioPlayer = document.getElementById('audioPlayer');

    function changeVolume(val) {
      if (gainNode) {
        gainNode.gain.value = (val / 100) * 0.8; // Bezpieczny mnożnik przeciwko charczeniu
      }
      document.getElementById('volume-val').innerText = val + '%';
    }

    function generateEqSliders() {
      const container = document.getElementById('eq-sliders-container');
      container.innerHTML = '';
      eqFrequencies.forEach((freq, index) => {
        const sliderGroup = document.createElement('div');
        sliderGroup.className = 'eq-slider-group';
        sliderGroup.innerHTML = `
          <div style="font-size:0.75rem; color:#888;" id="val-db-${index}">0dB</div>
          <div class="eq-slider-container">
            <input type="range" class="eq-slider" min="-20" max="20" value="0" step="0.1" oninput="changeEqFilter(${index}, this.value)">
          </div>
          <div style="font-size:0.7rem; font-weight:700;">${freq}</div>
        `;
        container.appendChild(sliderGroup);
      });
    }

    function initAudioContext() {
      if (isAudioInit) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      sourceNode = audioCtx.createMediaElementSource(audioPlayer);

      // Główny węzeł głośności zapobiegający przesterom
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 0.8; // 80% głośności bazowej zapobiega "chrzęszczeniu"

      eqFilters = eqFrequencies.map((freq, index) => {
        const filter = audioCtx.createBiquadFilter();
        if (index === 0) { filter.type = 'lowshelf'; filter.frequency.value = 32; }
        else if (index === eqFrequencies.length - 1) { filter.type = 'highshelf'; filter.frequency.value = 16000; }
        else {
          filter.type = 'peaking';
          filter.frequency.value = typeof freq === 'string' ? parseInt(freq) * 1000 : freq;
          filter.Q.value = 1;
        }
        filter.gain.value = 0;
        return filter;
      });

      // Łączymy: Źródło -> Filtry EQ -> Gain (Głośność) -> Głośniki
      let current = sourceNode;
      eqFilters.forEach(filter => {
        current.connect(filter);
        current = filter;
      });
      current.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      isAudioInit = true;
    }

    function changeEqFilter(index, value) {
      if (!isAudioInit) initAudioContext();
      document.getElementById(`val-db-${index}`).innerText = (value > 0 ? '+' : '') + parseFloat(value).toFixed(1) + 'dB';
      if (eqFilters[index]) {
        eqFilters[index].gain.value = parseFloat(value);
      }
    }

    async function loadMusicFromGitHub() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/music`);
        const data = await response.json();
        playlist = data.filter(file => file.name.endsWith('.mp3')).map(file => ({
          name: file.name.replace(/\.[^/.]+$/, ""),
          url: file.download_url
        }));
        renderPlaylist();
      } catch (err) {
        document.getElementById('song-list').innerHTML = "Błąd pobierania piosenek.";
      }
    }

    function renderPlaylist() {
      const songListEl = document.getElementById('song-list');
      songListEl.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `song-item ${index === currentIndex ? 'active' : ''}`;
        item.innerHTML = `<span>🎵 ${track.name}</span>`;
        item.onclick = () => playTrack(index);
        songListEl.appendChild(item);
      });
    }

    async function playTrack(index) {
      if (playlist.length === 0) return;
      currentIndex = index;
      const track = playlist[currentIndex];

      document.getElementById('nowPlayingTitle').innerText = "Odtwarzanie: " + track.name;

      try {
        const response = await fetch(track.url);
        const blob = await response.blob();
        audioPlayer.src = URL.createObjectURL(blob);
      } catch (e) {
        audioPlayer.src = track.url;
      }
      
      audioPlayer.play();

      if (!isAudioInit) initAudioContext();
      else if (audioCtx.state === 'suspended') audioCtx.resume();

      renderPlaylist();
    }

    function togglePlay() {
      if (audioPlayer.paused) audioPlayer.play();
      else audioPlayer.pause();
    }

    function nextTrack() {
      if (currentIndex + 1 < playlist.length) playTrack(currentIndex + 1);
      else playTrack(0);
    }

    function prevTrack() {
      if (currentIndex - 1 >= 0) playTrack(currentIndex - 1);
    }

    audioPlayer.onended = nextTrack;
    generateEqSliders();
    loadMusicFromGitHub();
  </script>
</body>
</html>
